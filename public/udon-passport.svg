    <rect x="10" y="10" width="268" height="200" rx="8" fill="none" stroke="#e6c95f" stroke-width="1.5" opacity="0.7"/>
    <text x="144" y="52" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#e6c95f">うどん県</text>
